version: "3"

vars:
  BINARY: scafctl-plugin-goscript
  DIST: "{{.ROOT_DIR | toSlash}}/dist"
  COVER: "{{.ROOT_DIR | toSlash}}/cover"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the plugin binary
    env:
      CGO_ENABLED: "0"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.DIST}}/{{.BINARY}}"
    cmds:
      - mkdir -p {{.DIST}}
      - >-
        go build -ldflags "-s -w"
        -o {{.DIST}}/{{.BINARY}}
        ./cmd/{{.BINARY}}/

  publish:local:
    desc: Publish the current binary to the local scafctl catalog as provider 'goscript'
    deps: [build]
    cmds:
      - >-
        scafctl build plugin --force
        --name goscript
        --kind provider
        --version 0.1.0
        --platform windows/amd64={{.DIST}}/{{.BINARY}}

  test:
    desc: Run tests
    cmds:
      - >-
        if command -v gcc >/dev/null 2>&1; then
          CGO_ENABLED=1 go test -race -count=1 -shuffle=on -timeout 5m ./...;
        else
          go test -count=1 -shuffle=on -timeout 5m ./...;
        fi

  test:cover:
    desc: Run tests with coverage
    cmds:
      - mkdir -p {{.COVER}}
      - >-
        if command -v gcc >/dev/null 2>&1; then
          CGO_ENABLED=1 go test -race -coverprofile={{.COVER}}/cover.out -covermode=atomic ./...;
        else
          go test -coverprofile={{.COVER}}/cover.out -covermode=atomic ./...;
        fi

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run linter with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -run='^$' -bench='.' -benchmem -count=1 ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/ cover/ .task/

  ci:
    desc: Full CI pipeline (lint + test + build)
    cmds:
      - task: lint
      - task: test
      - task: build
